<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4E78" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with squircle/rounded rect for maskable safe-zone -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Central Shield -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <path d="M 0,-140 C 70,-140 120,-110 120,-40 C 120,70 50,130 0,160 C -50,130 -120,70 -120,-40 C -120,-110 -70,-140 0,-140 Z" fill="#ffffff" />
    
    <!-- Syringe / Health Cross Icon inside shield -->
    <path d="M -22,-60 L 22,-60 L 22,-22 L 60,-22 L 60,22 L 22,22 L 22,60 L -22,60 L -22,22 L -60,22 L -60,-22 L -22,-22 Z" fill="#1F4E78" rx="6" />
    <circle cx="0" cy="0" r="14" fill="#0D9488" />
  </g>
</svg>
